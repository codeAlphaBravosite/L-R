<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shadow Practice</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14171C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shadow">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#14171C; --surface:#1B1F26; --surface-2:#20242C;
    --text:#EDEFF3; --muted:#8B93A3; --hairline:#262B34;
    --accent:#E8A33D; --accent-ink:#1A1400;
    --good:#6FBF8B; --danger:#E2635B;
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-serif:ui-serif,Georgia,"Iowan Old Style","Palatino Linotype",serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  button{font-family:inherit;}
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }

  header{
    padding:14px 20px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    position:sticky; top:0; background:var(--bg); z-index:5;
    border-bottom:1px solid var(--hairline);
    display:flex; align-items:center; gap:10px; min-height:24px;
  }
  header h1{font-size:16px; font-weight:600; margin:0; letter-spacing:-0.01em;}
  .back{
    background:none; border:none; color:var(--muted); font-size:14px;
    padding:6px 4px; cursor:pointer; font-family:var(--font-ui);
  }
  .back:active{opacity:0.6;}

  main{max-width:520px; margin:0 auto; padding:20px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:14px;
    padding:15px 18px; font-size:15px; font-weight:600; cursor:pointer; width:100%;
    transition:transform 100ms ease, opacity 100ms ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn.secondary{background:var(--surface); color:var(--text); border:1px solid var(--hairline);}
  .btn:disabled{opacity:0.35;}
  .btn:focus-visible, .back:focus-visible, .row-tap:focus-visible, .seg button:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  /* ---------- Library ---------- */
  .row-tap{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:16px 2px; border-bottom:1px solid var(--hairline);
    cursor:pointer; background:none; width:100%; text-align:left; border-top:none; border-left:none; border-right:none;
  }
  .row-tap:active{background:var(--surface);}
  .row-meta{flex:1; min-width:0;}
  .row-meta h3{margin:0 0 5px; font-size:15px; font-weight:600;}
  .row-meta p{margin:0 0 8px; color:var(--muted); font-size:13px;}
  .row-track{height:3px; background:var(--hairline); border-radius:2px; overflow:hidden; width:100%; max-width:220px;}
  .row-track > div{height:100%; background:var(--good);}
  .row-del{background:none; border:none; color:var(--muted); font-size:13px; padding:6px; cursor:pointer; flex-shrink:0;}
  .row-del:active{color:var(--danger);}
  .empty{color:var(--muted); text-align:center; padding:60px 12px; font-size:14px; line-height:1.6;}

  /* ---------- Import ---------- */
  .pick{
    display:block; width:100%; text-align:left; background:var(--surface);
    border:1px solid var(--hairline); border-radius:12px; padding:14px 16px;
    margin-bottom:12px; cursor:pointer; color:var(--text);
  }
  .pick .label{font-size:12px; color:var(--muted); margin-bottom:3px;}
  .pick .value{font-size:14px;}
  .pick input{display:none;}
  .row{display:flex; gap:10px;}
  .row .btn{flex:1;}
  #importErrors{color:var(--danger); font-size:13px; white-space:pre-wrap; margin-top:12px; line-height:1.5;}
  #importOk{color:var(--good); font-size:13px; white-space:pre-wrap; margin-top:12px; line-height:1.5;}

  /* ---------- Practice ---------- */
  .waveform{
    display:flex; align-items:flex-end; gap:2px; height:40px; margin-bottom:28px;
    overflow-x:auto; scrollbar-width:none;
  }
  .waveform::-webkit-scrollbar{display:none;}
  .tick{flex:1 1 0; min-width:2px; background:var(--hairline); border-radius:1px;}
  .tick.done{background:var(--good); opacity:0.5;}
  .tick.current{background:var(--accent);}

  .hero{
    font-family:var(--font-serif); font-size:25px; line-height:1.5; text-align:center;
    padding:8px 4px 28px; min-height:110px; display:flex; align-items:center; justify-content:center;
  }
  .pos{text-align:center; color:var(--muted); font-size:13px; margin-bottom:6px;}
  #chunkTiming{text-align:center; font-size:11px; color:var(--muted); opacity:0.7; margin-bottom:28px;}

  .transport{display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:24px;}
  .transport .side{
    width:52px; height:52px; border-radius:50%; background:var(--surface);
    border:1px solid var(--hairline); color:var(--text); font-size:18px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform 100ms ease;
  }
  .transport .side:active{transform:scale(0.93);}
  .transport .side:disabled{opacity:0.3;}
  .transport .main{
    width:76px; height:76px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
    border:none; font-size:26px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform 100ms ease;
  }
  .transport .main:active{transform:scale(0.94);}

  .seg{display:flex; background:var(--surface); border:1px solid var(--hairline); border-radius:11px; padding:3px; margin-bottom:14px;}
  .seg button{
    flex:1; background:none; border:none; color:var(--muted); font-size:13px; font-weight:600;
    padding:9px 4px; border-radius:8px; cursor:pointer;
  }
  .seg button.active{background:var(--accent); color:var(--accent-ink);}

  #playbackStatus{display:none; font-size:13px; text-align:center; line-height:1.5;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<header id="appHeader">
  <button class="back hidden" id="backToLibraryBtn">← Library</button>
  <h1 id="headerTitle">Shadow Practice</h1>
</header>

<main>

  <section id="libraryView">
    <button class="btn" id="showImportBtn">Add audio to practice</button>
    <div id="libraryList" style="margin-top:22px;"></div>
  </section>

  <section id="importView" class="hidden">
    <label class="pick">
      <div class="label">Session JSON (from Phase 1)</div>
      <div class="value" id="jsonFileLabel">Choose file</div>
      <input type="file" id="jsonInput" accept="application/json,.json">
    </label>
    <label class="pick">
      <div class="label">Matching audio file</div>
      <div class="value" id="audioFileLabel">Choose file</div>
      <input type="file" id="audioInput" accept="audio/*">
    </label>
    <div class="row" style="margin-top:6px;">
      <button class="btn secondary" id="cancelImportBtn">Cancel</button>
      <button class="btn" id="confirmImportBtn" disabled>Import</button>
    </div>
    <div id="importErrors"></div>
    <div id="importOk"></div>
  </section>

  <section id="practiceView" class="hidden">
    <div class="waveform" id="waveform"></div>
    <div class="hero" id="chunkText">—</div>
    <div class="pos" id="chunkPos">chunk 0 of 0</div>
  <div id="chunkTiming"></div>

    <div class="transport">
      <button class="side" id="prevBtn" aria-label="Previous">⏮</button>
      <button class="main" id="playRepeatBtn" aria-label="Play or repeat chunk">▶</button>
      <button class="side" id="nextBtn" aria-label="Next">⏭</button>
    </div>

    <div class="seg" id="speedSegmented">
      <button data-rate="0.6">0.6x</button>
      <button data-rate="0.75">0.75x</button>
      <button data-rate="1" class="active">1x</button>
      <button data-rate="1.15">1.15x</button>
    </div>

    <div id="playbackStatus"></div>
  </section>

</main>

<audio id="audioEl" preload="auto"></audio>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    });
  }
</script>
</body>
</html>
