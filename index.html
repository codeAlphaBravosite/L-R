<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shadow Practice</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12151c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shadow">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#12151c; --card:#1c212c; --text:#e8ebf1; --muted:#8a93a6;
    --accent:#5b8cff; --danger:#ff5b6e; --ok:#4fd18b; --warn:#ffb84f;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  header{
    padding:16px 16px 12px; padding-top:calc(16px + env(safe-area-inset-top,0px));
    position:sticky; top:0; background:var(--bg); z-index:5; border-bottom:1px solid #262c3a;
  }
  header h1{font-size:18px;margin:0;}
  main{max-width:520px;margin:0 auto;padding:16px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--accent);color:#fff;border:none;border-radius:12px;
    padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;width:100%;
  }
  .btn.secondary{background:#2a3040;color:var(--text);}
  .btn.danger{background:var(--danger);}
  .btn:disabled{opacity:.4;}
  .row{display:flex;gap:8px;}
  .row .btn{flex:1;}
  .card{
    background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .card .meta{flex:1;min-width:0;}
  .card h3{margin:0 0 4px;font-size:15px;}
  .card p{margin:0;color:var(--muted);font-size:13px;}
  .empty{color:var(--muted);text-align:center;padding:40px 12px;}
  input[type=file]{
    width:100%;color:var(--muted);background:var(--card);border-radius:10px;
    padding:12px;margin-bottom:10px;font-size:13px;
  }
  label.field{display:block;font-size:13px;color:var(--muted);margin:14px 0 4px;}
  #importErrors{color:var(--danger);font-size:13px;white-space:pre-wrap;margin-top:8px;}
  #importOk{color:var(--ok);font-size:13px;margin-top:8px;}
  .hidden{display:none !important;}
  .practice-text{
    background:var(--card);border-radius:16px;padding:28px 20px;text-align:center;
    font-size:22px;line-height:1.5;min-height:120px;display:flex;align-items:center;justify-content:center;
  }
  .chunk-pos{text-align:center;color:var(--muted);font-size:13px;margin:10px 0 18px;}
  select{
    background:var(--card);color:var(--text);border:1px solid #2a3040;border-radius:10px;
    padding:8px 10px;font-size:14px;
  }
  .controls-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
  .top-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  progress{width:100%;height:6px;border-radius:3px;accent-color:var(--accent);margin-top:10px;}
</style>
</head>
<body>

<header>
  <h1 id="headerTitle">Shadow Practice</h1>
</header>

<main>

  <!-- LIBRARY VIEW -->
  <section id="libraryView">
    <button class="btn" id="showImportBtn">+ Add audio to practice</button>
    <div id="libraryList" style="margin-top:16px;"></div>
  </section>

  <!-- IMPORT VIEW -->
  <section id="importView" class="hidden">
    <label class="field">Session JSON (from Phase 1)</label>
    <input type="file" id="jsonInput" accept="application/json,.json">
    <label class="field">Matching audio file</label>
    <input type="file" id="audioInput" accept="audio/*">
    <div class="row">
      <button class="btn secondary" id="cancelImportBtn">Cancel</button>
      <button class="btn" id="confirmImportBtn" disabled>Import</button>
    </div>
    <div id="importErrors"></div>
    <div id="importOk"></div>
  </section>

  <!-- PRACTICE VIEW -->
  <section id="practiceView" class="hidden">
    <div class="top-controls">
      <button class="btn secondary" id="backToLibraryBtn" style="width:auto;padding:8px 14px;">← Library</button>
      <select id="speedSelect">
        <option value="0.6">0.6x</option>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.15">1.15x</option>
      </select>
    </div>

    <div class="practice-text" id="chunkText">—</div>
    <div class="chunk-pos" id="chunkPos">chunk 0 of 0</div>
    <progress id="progressBar" value="0" max="100"></progress>

    <div class="controls-grid">
      <button class="btn secondary" id="prevBtn">⏮ Prev</button>
      <button class="btn secondary" id="replayBtn">↻ Replay</button>
      <button class="btn" id="playBtn" style="grid-column:span 2;">▶ Play chunk</button>
      <button class="btn secondary" id="nextBtn" style="grid-column:span 2;">Next ⏭</button>
    </div>
  </section>

</main>

<audio id="audioEl" preload="auto"></audio>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    });
  }
</script>
</body>
</html>
